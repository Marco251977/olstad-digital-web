# The fixed preview address (Vercel branch alias of `preview`) always shows the latest main: every push to main
# moves the branch `preview` to the same commit, and Vercel builds it as a Preview deployment (Preview env vars).
# Linux, a few seconds per push, one run at a time.
name: preview-follows-main
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: preview-follows-main
  cancel-in-progress: true
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/preview
