<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin – Olstad Digital</title>
  <meta name="description" content="Admin">
  <meta name="color-scheme" content="light dark">
  
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/hanken-grotesk.css">

<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="logo" href="/en" aria-label="Olstad Digital – Olstad Digital" lang="en" dir="ltr">Olstad Digital</a>
    </div>
  </header>
  <main id="content" class="wrap admin">
    <h1 data-t="title">Admin</h1>
    <form id="password-form" class="admin-form" method="post" action="/admin" hidden>
      <label for="login-email" data-t="email">E-mail</label>
      <input id="login-email" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password" data-t="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" data-t="verify">Log in</button>
      <button class="link-btn" type="button" id="forgot" data-t="forgotPassword">Forgot password?</button>
    </form>
    <form id="email-form" class="admin-form" hidden>
      <p data-t="codeHint">We will send a one-time code to your e-mail.</p>
      <label for="email" data-t="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button class="btn primary" type="submit" data-t="sendCode">Send code</button>
      <button class="link-btn" type="button" data-back="password" data-t="usePassword">Log in with password</button>
    </form>
    <form id="code-form" class="admin-form" hidden>
      <p id="sent"></p>
      <label for="code" data-t="code">Code from the e-mail</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required>
      <button class="btn primary" type="submit" data-t="verify">Log in</button>
      <button class="link-btn" type="button" data-back="password" data-t="usePassword">Log in with password</button>
    </form>
    <section id="inside" class="admin-inside" hidden>
      <p class="muted admin-who" id="who"></p>
      <h2 data-t="apps">Apps</h2>
      <ul class="admin-apps"><li><a class="admin-card admin-app-link" href="/admin/saldo-pocket"><img class="app-icon" src="/apps/saldo-pocket/icon.png" alt="" width="56" height="56"><span class="admin-app-text"><strong>Saldo Pocket</strong><span class="muted" data-t="seeStats">See statistics</span></span><svg class="icon dir" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></a></li><li><a class="admin-card admin-app-link" href="/admin/plantravel"><img class="app-icon" src="/apps/plantravel/icon.png" alt="" width="56" height="56"><span class="admin-app-text"><strong>PlanTravel</strong><span class="muted" data-t="seeStats">See statistics</span></span><svg class="icon dir" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></a></li></ul>
      <button class="btn ghost" id="sign-out" type="button" data-t="signOut">Log out</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'btn ghost';
      again.textContent = t.retry;
      again.addEventListener('click', function () { say(''); loadStats(); });
      p.appendChild(document.createElement('br'));
      p.appendChild(again);
    };
    call({ action: 'stats', app: box.getAttribute('data-app'), includeTest: !!(toggle && toggle.checked) }).then(function (j) {
      if (j.status !== 200) return failed(j);
      if (!j.data) { box.removeAttribute('aria-busy'); return line(box, t.noData); }
      return import('/assets/admin-stats.js').then(function (m) {
        m.mountStats(box, j.data, t, lang, typeof NAMES === 'object' ? NAMES[lang] || {} : {});
        box.removeAttribute('aria-busy');
      });
    }).catch(function () { failed({ error: 'offline', status: 0 }); });
  };
  // Back online after a failed load: try again by itself.
  window.addEventListener('online', function () {
    if (!$('inside').hidden && $('stats') && $('stats').querySelector('.admin-card button')) { say(''); loadStats(); }
  });
  // «Til godkjenning»: the badge (how many wait) after sign-in, the queue in place when the button is pressed. Every action
  // goes to the server and the queue is fetched again after it, so what is shown is always the server's state.
  var setCount = function (n) {
    var b = $('approval-count');
    if (!b) return;
    b.hidden = !(n > 0);
    b.textContent = n > 0 ? new Intl.NumberFormat(lang).format(n) : '';
  };
  var countQueue = function () {
    if (!$('approval-panel')) return;
    call({ action: 'queueCount', app: $('approval-panel').getAttribute('data-app') }).then(function (j) { if (j.status === 200) setCount(j.total); }, function () {});
  };
  var loadQueue = function (notice) {
    var box = $('approval-panel');
    line(box, t.queue.loading);
    box.setAttribute('aria-busy', 'true');
    var failed = function (j) {
      box.removeAttribute('aria-busy');
      var f = failText(j);
      var p = line(box, t[f[0]] + (f[1] ? ' (' + f[1] + ')' : ''));
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'btn ghost';
      again.textContent = t.retry;
      again.addEventListener('click', function () { loadQueue(); });
      p.appendChild(document.createElement('br'));
      p.appendChild(again);
    };
    call({ action: 'queue', app: box.getAttribute('data-app') }).then(function (j) {
      if (j.status !== 200) return failed(j);
      return import('/assets/admin-queue.js').then(function (m) {
        var model = m.renderQueue(box, j.data, t, lang, act);
        setCount(model.total);
        if (notice) {
          var n = document.createElement('p');
          n.className = 'queue-done';
          n.setAttribute('role', 'status');
          n.textContent = notice;
          box.insertBefore(n, box.firstChild);
        }
        box.removeAttribute('aria-busy');
      });
    }).catch(function () { failed({ error: 'offline', status: 0 }); });
  };
  var act = function (request, item) {
    var buttons = item.querySelectorAll('button');
    buttons.forEach(function (b) { b.disabled = true; });
    item.setAttribute('aria-busy', 'true');
    var old = item.querySelector('.queue-error');
    if (old) old.remove();
    var undo = function (j) {
      buttons.forEach(function (b) { b.disabled = false; });
      item.removeAttribute('aria-busy');
      var f = failText(j);
      var p = document.createElement('p');
      p.className = 'queue-error';
      p.setAttribute('role', 'alert');
      p.textContent = t.queue.actionFailed + ' ' + t[f[0]] + (f[1] ? ' (' + f[1] + ')' : '');
      item.appendChild(p);
    };
    call({ action: 'queueAction', app: $('approval-panel').getAttribute('data-app'), request: request }).then(function (j) {
      if (j.status !== 200) return undo(j);
      loadQueue(t.queue.done[request.action]);
    }, function () { undo({ error: 'offline', status: 0 }); });
  };
  if ($('approval-open')) $('approval-open').addEventListener('click', function () {
    var open = $('approval-panel').hidden;
    $('approval-panel').hidden = !open;
    $('approval-open').setAttribute('aria-expanded', String(open));
    if (open) loadQueue();
  });
  if ($('include-test')) $('include-test').addEventListener('change', function () {
    if (!$('inside').hidden) loadStats();
  });
  var show = function (email) {
    form(''); $('inside').hidden = false; $('who').textContent = email; say('');
    loadStats();
    countQueue();
  };
  var check = function () {
    say('checking');
    return call({ action: 'me' }).then(function (j) {
      if (j.status === 200) return show(j.email);
      signedOut();
      if (j.status === 401) say(''); else fail(j);
    }, function () { signedOut(); say('offline'); });
  };
  check();
  // E-mail + password: a real form, so the browser's password manager offers to save and fill it.
  $('password-form').addEventListener('submit', function (e) {
    e.preventDefault();
    call({ action: 'login', email: $('login-email').value.trim(), password: $('password').value }).then(function (j) {
      if (j.status === 200) { $('password').value = ''; return check(); }
      $('password').value = '';
      $('password').focus();
      fail(j);
    }, function () { say('offline'); });
  });
  // «Forgot password?»: the e-mail code, the fallback.
  $('forgot').addEventListener('click', function () {
    $('email').value = $('login-email').value.trim();
    form('email-form'); say(''); $('email').focus();
  });
  document.querySelectorAll('[data-back="password"]').forEach(function (b) {
    b.addEventListener('click', function () { form('password-form'); say(''); $('login-email').focus(); });
  });
  var email = '';
  $('email-form').addEventListener('submit', function (e) {
    e.preventDefault();
    email = $('email').value.trim();
    call({ action: 'code', email: email }).then(function (j) {
      if (j.status === 200) { form('code-form'); $('sent').textContent = t.sent.replace('%email%', email); $('code').focus(); say(''); }
      else fail(j);
    }, function () { say('offline'); });
  });
  $('code-form').addEventListener('submit', function (e) {
    e.preventDefault();
    call({ action: 'verify', email: email, code: $('code').value.trim() }).then(function (j) {
      if (j.status === 200) return check();
      fail(j);
    }, function () { say('offline'); });
  });
  $('sign-out').addEventListener('click', function () {
    var away = function () { location.href = '/admin'; };
    call({ action: 'logout' }).then(away, away);
  });
})();
  </script>
</body>
</html>
