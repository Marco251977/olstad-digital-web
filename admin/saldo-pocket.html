<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saldo Pocket – Olstad Digital</title>
  <meta name="description" content="Admin">
  <meta name="color-scheme" content="light dark">
  
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/hanken-grotesk.css">
  <link rel="stylesheet" href="/assets/home-tokens.css">
  <link rel="stylesheet" href="/assets/home.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="logo" href="/en" aria-label="Olstad Digital – Olstad Digital" lang="en" dir="ltr">Olstad Digital</a>
    </div>
  </header>
  <main id="content" class="wrap admin admin-wide">
    <h1 data-t="title">Admin</h1>
    <form id="email-form" class="admin-form" hidden>
      <label for="email" data-t="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button class="btn primary" type="submit" data-t="sendCode">Send code</button>
    </form>
    <form id="code-form" class="admin-form" hidden>
      <p id="sent"></p>
      <label for="code" data-t="code">Code from the e-mail</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required>
      <button class="btn primary" type="submit" data-t="verify">Log in</button>
    </form>
    <section id="inside" class="admin-inside" hidden>
      <p class="muted admin-who" id="who"></p>
      <a class="back" href="/admin"><svg class="icon dir" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg><span data-t="allApps">All apps</span></a>
      <div class="admin-approval">
        <button class="btn primary" type="button" id="approval-open" aria-expanded="false" aria-controls="approval-empty"><span data-t="approval">Awaiting approval</span></button>
        <p class="admin-card muted" id="approval-empty" data-t="approvalEmpty" hidden>Nothing is waiting for approval.</p>
      </div>
      <div class="admin-app-head"><img class="app-icon" src="/apps/saldo-pocket/icon.png" alt="" width="56" height="56"><h2>Saldo Pocket</h2></div>
      <label class="admin-toggle"><input type="checkbox" id="include-test" role="switch"><span data-t="includeTest">Include test traffic</span></label>
      <div id="stats" class="admin-stats" data-app="saldo-pocket" aria-live="polite"><p class="admin-card muted" data-t="checking">Checking …</p></div>
      <button class="btn ghost" id="sign-out" type="button" data-t="signOut">Log out</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  var RTL = ["ar"];

  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
